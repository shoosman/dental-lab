<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meow Meow Dent</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>
// Тема до первой отрисовки, чтобы не мигало
try { const p = JSON.parse(localStorage.getItem("lab-prefs") || "{}"); if (p.theme === "light" || p.theme === "dark") document.documentElement.setAttribute("data-theme", p.theme); if (p.scale) document.documentElement.style.zoom = p.scale; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: одна колонка до 640px, липкая шапка с двумя вкладками; день — карточки заказов, календарь — сетка 7×N */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --line: #d9e2e2;
  --fg: #17282b;
  --muted: #5d7275;
  --accent: #1f7a78;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
  --accent-ink: var(--accent);      /* акцент как цвет текста; у пастельных — темнее */
  --on-accent: var(--surface);      /* текст поверх акцентной заливки; у пастельных — тёмный */
  --ok: #2e8b57; --ok-bg: #dff3e6;
  --warn: #b27a00; --warn-bg: #fdf0c8;
  --bad: #c0392b; --bad-bg: #fbe0dc;
  --calm: #5b6b70; --calm-bg: #e6ebed;   /* «свободно» и «всё сдано»: нейтральный, не зависит от акцента */
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
/* Тёмная тема: по системе (если в меню не выбрана светлая) или принудительно */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1c; --surface: #172427; --line: #29393c; --fg: #e4eeee; --muted: #93a8aa;
  --accent: #5cc4c0;
  --ok: #5fd08d; --ok-bg: #15362a; --warn: #f0c04a; --warn-bg: #3a3014; --bad: #ff7b6b; --bad-bg: #401d1a; --calm: #a9b7bb; --calm-bg: #243134;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1a1c; --surface: #172427; --line: #29393c; --fg: #e4eeee; --muted: #93a8aa;
  --accent: #5cc4c0;
  --ok: #5fd08d; --ok-bg: #15362a; --warn: #f0c04a; --warn-bg: #3a3014; --bad: #ff7b6b; --bad-bg: #401d1a; --calm: #a9b7bb; --calm-bg: #243134;
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 640px; margin: 0 auto; }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.brandleft { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { font: 600 13px/1 var(--font-display); letter-spacing: .04em; color: var(--accent-ink); text-transform: uppercase; }
.menubtn { border: 0; background: none; color: var(--fg); font-size: 22px; line-height: 1; padding: 2px 4px 2px 0; }

/* боковое меню */
.drawer-ov { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; width: min(320px, 86%); background: var(--surface); overflow: auto;
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 0 30px rgb(0 0 0 / .2); }
@media (prefers-reduced-motion: no-preference) { .drawer.enter { animation: slidein .18s ease-out; } @keyframes slidein { from { transform: translateX(-100%); } } }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dtitle { font: 600 18px/1.2 var(--font-display); margin: 0; text-transform: none; letter-spacing: 0; color: var(--fg); }
.dclose, .dback { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 6px 0; }
.dclose { font-size: 22px; line-height: 1; }
.mitems { display: grid; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 2px; font-weight: 600; text-align: left; }
.mitem .hint { color: var(--muted); font-weight: 400; font-size: 14px; }
.dsec { display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { min-width: 0; border: 0; background: none; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--c); }
.sw[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 3px; }
.wish { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wish label { min-width: 0; overflow-wrap: anywhere; }
.wish b { display: block; font-weight: 600; }
.wish label span { display: block; color: var(--muted); font-size: 13px; }
.wish { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; border-radius: 10px; }
.wish.confirm { background: var(--bad-bg); padding-inline: 8px; }
.wconfirm { display: none; grid-column: 1 / -1; gap: 8px; }
.wish.confirm .wconfirm { display: flex; }
.wconfirm button { border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.wremove { border: 0; background: var(--bad); color: var(--surface); }
.wcancel { border: 1px solid var(--line); background: var(--surface); }
.wedit-btn { border: 0; background: var(--accent); color: var(--on-accent); }
.wish.editing { grid-template-columns: 1fr; background: var(--bg); padding-inline: 8px; }
.wedit { display: grid; gap: 8px; }
.wedit input, .wedit textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.wedit .wconfirm { display: flex; }
.drawer .linkbtn { justify-self: start; }
.syncbtn { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 0; white-space: nowrap; }
.syncbtn.ok { color: var(--ok); }
.syncbtn.err { color: var(--bad); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: none; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; }
h1 { font: 600 clamp(22px, 6vw, 28px)/1.15 var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.dayhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dayhead .grow { flex: 1; min-width: 0; }
.sub { color: var(--muted); font-size: 14px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; font-size: 20px; line-height: 1; }
.linkbtn { border: 0; background: var(--accent-soft); color: var(--accent-ink); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 14px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.l0 { background: var(--calm-bg); color: var(--calm); }
.l1 { background: var(--ok-bg); color: var(--ok); }
.l2 { background: var(--warn-bg); color: var(--warn); }
.l3 { background: var(--bad-bg); color: var(--bad); }

.notice { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.notice.remind { background: var(--warn-bg); border-left: 4px solid var(--warn); }
.notice.overdue { background: var(--bad-bg); border-left: 4px solid var(--bad); }
.notice.info { background: var(--surface); border: 1px dashed var(--line); color: var(--muted); }
.notice b { font-weight: 700; }

.list { display: grid; gap: 8px; }
.order { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; }
.order.done { opacity: .55; }
.order.done .work { text-decoration: line-through; }
.order .body { min-width: 0; }
.work { font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.note { font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
.check { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--ok); }
.edit { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 4px 6px; text-decoration: underline; }
.empty { color: var(--muted); padding: 14px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

.upcoming { display: grid; gap: 8px; }
.uday { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px; text-align: left; width: 100%; }
.uday .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.uday ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }

.fabs { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; align-items: center; gap: 10px; }
.fab { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 14px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgb(0 0 0 / .18); }
.micfab { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 4px 14px rgb(0 0 0 / .12); }

.calhead { display: flex; align-items: center; gap: 8px; }
.calhead h1 { flex: 1; text-align: center; font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding-block: 4px; }
.cell { aspect-ratio: 1 / 1.05; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; text-align: left; min-width: 0; }
.cell .n { font-size: 14px; font-variant-numeric: tabular-nums; }
.cell .c { align-self: flex-end; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.cell.out { visibility: hidden; }
.cell.today { outline: 2px solid var(--accent-ink); outline-offset: -2px; }
.cell.past { opacity: .6; }
.cell.l1 { background: var(--ok-bg); border-color: transparent; }
.cell.l2 { background: var(--warn-bg); border-color: transparent; }
.cell.l3 { background: var(--bad-bg); border-color: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h2 { font: 600 18px/1.2 var(--font-display); text-transform: none; letter-spacing: 0; color: var(--fg); }
.sheet ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
.sheet code { font-size: 13px; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.donebox { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .primary { flex: 1; border: 0; background: var(--accent); color: var(--on-accent); padding: 12px; border-radius: 12px; font-weight: 700; }
.actions .ghost { border: 1px solid var(--line); background: none; padding: 12px 14px; border-radius: 12px; }
.actions .danger { border: 1px solid var(--bad); color: var(--bad); background: none; padding: 12px 14px; border-radius: 12px; }
.actions .danger.armed { background: var(--bad); color: var(--surface); }
.msg { font-size: 14px; }
.stagepill { margin-top: 6px; border: 0; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stagepill.empty { background: none; border: 1px dashed var(--line); color: var(--muted); font-weight: 500; }
.stagelist { display: grid; gap: 6px; }
.stageopt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.stageopt[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.stageopt .num { width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.stageopt[aria-pressed="true"] .num { color: inherit; }
.stageopt .meta { display: block; }
.heard { background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; color: var(--muted); }
.heard b { color: var(--fg); font-weight: 500; }
.vhead { display: flex; align-items: center; gap: 8px; }
.vhead h2 { margin: 0; }
.infobtn { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1.5px solid var(--muted); background: none; color: var(--muted); font: 700 12px/1 var(--font-body); display: grid; place-items: center; }
.infobtn[aria-expanded="true"] { border-color: var(--accent-ink); color: var(--accent-ink); }
.vhelp { font-size: 13px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.vhelp ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.vhelp b { font-weight: 600; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .order, .cell, .tabs button { transition: background .15s, opacity .15s; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brandleft"><button class="menubtn" id="menubtn" aria-label="Меню">☰</button><div class="brand">Meow Meow Dent</div></div>
      <button class="syncbtn" id="syncbtn">☁ не подключено</button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-day" role="tab" aria-selected="true">День</button>
      <button id="tab-cal" role="tab" aria-selected="false">Календарь</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="fabs">
  <button class="micfab" id="micbtn" aria-label="Голосовой ввод" title="Голосовой ввод"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
  <button class="fab" id="fab">+ Заказ</button>
</div>
<div id="modal"></div>

<script>
const WORKS = ["Коронка металлокерамика","Коронка цирконий","Коронка E.max","Временная коронка","Винир","Вкладка","Мост","Бюгельный протез","Съёмный протез","Каппа","Ремонт протеза"];
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

/* ---------- локальное хранилище ---------- */
// store.orders: id -> заказ; удалённые остаются «надгробием» { deleted: true }, чтобы другое устройство не вернуло их при слиянии
const LS_DATA = "lab-orders", LS_SYNC = "lab-sync", LS_DIRTY = "lab-dirty";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let store = lsGet(LS_DATA, { orders: {} });
store.wishes = store.wishes || {};   // доработки: отметки и свои просьбы
// Перед записью сливаем с тем, что лежит в localStorage: вторая вкладка могла записать свои правки
const saveLocal = () => { const cur = lsGet(LS_DATA, null); if (cur) store = merge(store, { orders: cur.orders || {}, wishes: cur.wishes || {} }); lsSet(LS_DATA, store); };
let editSeq = 0;   // счётчик правок: dirty снимаем, только если за время отправки новых не было
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const S = { view: "day", sel: null, calY: 0, calM: 0 };
const live = () => Object.values(store.orders).filter(o => !o.deleted && o.due);

/* ---------- даты ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const human = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const rel = s => { const t = today(); if (s === t) return "Сегодня"; if (s === addDays(t, 1)) return "Завтра"; if (s === addDays(t, 2)) return "Послезавтра"; if (s === addDays(t, -1)) return "Вчера"; return cap(WD[parse(s).getDay()]); };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
const works = n => `${n} ${plural(n, "работа", "работы", "работ")}`;
const worksAcc = n => `${n} ${plural(n, "работу", "работы", "работ")}`;   // «сдать 1 работу»

// Нагрузка дня по несданным работам: 1 — зелёный, 2–4 — жёлтый, 5 и больше — красный
const level = n => n <= 0 ? 0 : n === 1 ? 1 : n <= 4 ? 2 : 3;
const dueOn = d => live().filter(o => o.due === d);
const openOn = d => dueOn(d).filter(o => !o.done);
const chip = n => `<span class="chip l${level(n)}">${n ? works(n) : "свободно"}</span>`;
const byWork = (a, b) => (a.done - b.done) || (a.doctor || "").localeCompare(b.doctor || "");

/* ---------- разбор голосовой фразы в заказ ---------- */
// «коронка цирконий две штуки, Петров, клиника Улыбка, к пятнице, цвет А2» → поля формы.
// Чего не нашли — оставляем пустым: форму человек всё равно проверяет перед сохранением.
const VOICE_NUM = { "один": 1, "одна": 1, "одну": 1, "одного": 1, "одной": 1, "два": 2, "две": 2, "двух": 2, "три": 3, "трех": 3, "четыре": 4, "четырех": 4,
  "пять": 5, "пяти": 5, "шесть": 6, "шести": 6, "семь": 7, "семи": 7, "восемь": 8, "восьми": 8, "девять": 9, "девяти": 9, "десять": 10, "десяти": 10,
  "одиннадцать": 11, "двенадцать": 12, "тринадцать": 13, "четырнадцать": 14, "пятнадцать": 15, "шестнадцать": 16, "семнадцать": 17,
  "восемнадцать": 18, "девятнадцать": 19, "двадцать": 20, "тридцать": 30 };
// Порядковые для дат: «двадцать пятого октября»
const VOICE_ORD = [["одиннадцат", 11], ["двенадцат", 12], ["тринадцат", 13], ["четырнадцат", 14], ["пятнадцат", 15], ["шестнадцат", 16],
  ["семнадцат", 17], ["восемнадцат", 18], ["девятнадцат", 19], ["двадцат", 20], ["тридцат", 30], ["перв", 1], ["втор", 2], ["трет", 3],
  ["четверт", 4], ["пят", 5], ["шест", 6], ["седьм", 7], ["восьм", 8], ["девят", 9], ["десят", 10]];
const VOICE_MONTHS = ["январ", "феврал", "март", "апрел", "ма", "июн", "июл", "август", "сентябр", "октябр", "ноябр", "декабр"];
const VOICE_WD = [["воскресень", 0], ["понедельник", 1], ["вторник", 2], ["сред", 3], ["четверг", 4], ["пятниц", 5], ["суббот", 6]];
const VOICE_TYPES = [[/коронк/, "Коронка"], [/\sмост/, "Мост"], [/винир/, "Винир"], [/вкладк|культев/, "Вкладка"], [/бюгел/, "Бюгельный протез"],
  [/съемн/, "Съёмный протез"], [/капп/, "Каппа"], [/ремонт|почин/, "Ремонт протеза"]];
const VOICE_MATERIALS = [[/циркон|диоксид/, "цирконий"], [/e\.?\s?-?max|[еэи]\s?-?макс/, "E.max"], [/металл?о-?\s?керам|\sмк\s/, "металлокерамика"]];
// Служебные слова: короткие — только целиком (иначе «к» съест «Кузнецова»), длинные — по началу
const VOICE_STOP = /^(врач|доктор|от|для|к|на|в|во|до|через|и|а|сдать|срок|сегодня|завтра|послезавтра|этап|мастер|техник)$|^(клиник|стоматолог|цвет|пациент|штук|единиц|коронк|мост|сдач|систем|делает|сделает|исполнител|отда)/;
// Системы (импланты и т.п.) — уходят в комментарий
const VOICE_SYSTEMS = [[/штрауман|straumann/, "Straumann"], [/нобел|nobel/, "Nobel"], [/о?с+тем|osstem/, "Osstem"], [/\sмис\s|\smis\s/, "MIS"],
  [/альфа\s?-?био|alpha\s?-?bio/, "Alpha-Bio"], [/дентиум|dentium/, "Dentium"], [/астра|astra/, "Astra Tech"], [/мегаген|megagen/, "MegaGen"],
  [/имплантиум|implantium/, "Implantium"], [/анкилос|ankylos/, "Ankylos"], [/неодент|neodent/, "Neodent"], [/\sбего\s|bego/, "BEGO"],
  [/хайоссен|hiossen/, "Hiossen"], [/\sдио\s|\sdio\s/, "DIO"], [/биохорайзон|biohorizons/, "BioHorizons"], [/импро|impro/, "Impro"]];

function voiceNormalize(text) {
  // числа словами → цифрами; «двадцать пятого» → «25-го»
  const words = text.toLowerCase().replace(/ё/g, "е").replace(/[,;!?]/g, " , ").split(/\s+/).filter(Boolean);
  const out = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i], next = words[i + 1] || "";
    const ord = t => { const m = /^(.*?)(ьего|ьему|его|ему|ого|ому|ье|ья|ое|ой|ым|им|ая|ый|ий)$/.exec(t); if (!m) return 0; const hit = VOICE_ORD.find(([st]) => m[1] === st || m[1] === st.replace(/ь$/, "")); return hit ? hit[1] : 0; };
    if ((w === "двадцать" || w === "тридцать") && (VOICE_NUM[next] < 10 || ord(next) && ord(next) < 10)) {
      if (ord(next)) { out.push(VOICE_NUM[w] + ord(next) + "-го"); i++; continue; }
      out.push(String(VOICE_NUM[w] + VOICE_NUM[next])); i++; continue;
    }
    if (VOICE_NUM[w] !== undefined) { out.push(String(VOICE_NUM[w])); continue; }
    if (ord(w)) { out.push(ord(w) + "-го"); continue; }
    out.push(w);
  }
  return " " + out.join(" ") + " ";
}

function voiceDate(s, todayIso) {
  const base = parse(todayIso), mk = (y, m, d) => iso(new Date(y, m, d));
  let m;
  if ((m = /\s(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\s/.exec(s))) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : base.getFullYear();
    return { due: mk(y, +m[2] - 1, +m[1]), hit: m[0] };
  }
  // «25 октября» — текущий год; «25 октября 2027 (года)», «… две тысячи двадцать седьмого года», «… 27-го года» — названный
  if ((m = new RegExp(`\\s(\\d{1,2})(?:-?го|-?е)?\\s+(${VOICE_MONTHS.join("|")})[а-я]*`
      + `(?:\\s+(\\d{4})(?:\\s+год[а-я]*)?|\\s+2\\s+тысяч[а-я]*\\s+(\\d{1,2})(?:-?го|-?й)?(?:\\s+год[а-я]*)?|\\s+(\\d{2})(?:-?го|-?й)?\\s+год[а-я]*)?`).exec(s))) {
    const mon = VOICE_MONTHS.indexOf(m[2]);
    const y = m[3] ? +m[3] : m[4] ? 2000 + +m[4] : m[5] ? 2000 + +m[5] : base.getFullYear();
    return { due: mk(y, mon, +m[1]), hit: m[0] };
  }
  if ((m = /\s(?:к\s+|на\s+|до\s+)?(\d{1,2})(?:-?го|-?е|-?му)?\s+числ[а-я]*/.exec(s))) {
    let d = mk(base.getFullYear(), base.getMonth(), +m[1]);
    if (d < todayIso) d = mk(base.getFullYear(), base.getMonth() + 1, +m[1]);
    return { due: d, hit: m[0] };
  }
  if ((m = /\sпослезавтра/.exec(s))) return { due: addDays(todayIso, 2), hit: m[0] };
  if ((m = /\sзавтра/.exec(s))) return { due: addDays(todayIso, 1), hit: m[0] };
  if ((m = /\sсегодня/.exec(s))) return { due: todayIso, hit: m[0] };
  if ((m = /\sчерез\s+(\d+\s+)?(день|дня|дней|недел[а-я]*)/.exec(s))) {
    const n = m[1] ? +m[1] : 1, week = m[2].startsWith("недел");
    return { due: addDays(todayIso, week ? 7 * n : (m[1] ? n : 2)), hit: m[0] };   // «через день» = послезавтра
  }
  if ((m = new RegExp(`\\s(?:(?:в|во|к|на|до)\\s+)?(следующ[а-я]*\\s+)?(${VOICE_WD.map(w => w[0]).join("|")})[а-я]*`).exec(s))) {
    const wd = VOICE_WD.find(w => w[0] === m[2])[1], dow = base.getDay();
    let add = (wd - dow + 7) % 7 || 7;                       // ближайший такой день после сегодняшнего
    if (m[1] && add < ((7 - dow) % 7 || 7)) add += 7;        // «в следующую пятницу» — пятница следующей недели
    return { due: addDays(todayIso, add), hit: m[0] };
  }
  return { due: "", hit: "" };
}

function voiceShade(s) {
  // Цвет по шкале VITA: «цвет а2», «цвет бэ 1», «A3.5»
  const L = { "a": "A", "а": "A", "b": "B", "б": "B", "бэ": "B", "в": "B", "c": "C", "с": "C", "ц": "C", "цэ": "C", "d": "D", "д": "D", "дэ": "D" };
  const m = /цвет[а-я]*\s+(a|b|c|d|а|б|бэ|в|с|ц|цэ|д|дэ)\s*-?\s*(\d(?:[.,]5)?)/.exec(s) || /\s(a|b|c|d)\s?(\d(?:[.,]5)?)\s/.exec(s);
  return m ? { shade: L[m[1]] + m[2].replace(",", "."), hit: m[0] } : { shade: "", hit: "" };
}

function voiceWork(s, knownWorks) {
  const known = knownWorks.filter(w => w && s.includes(" " + w.toLowerCase().replace(/ё/g, "е") + " "));
  if (known.length) return known.sort((a, b) => b.length - a.length)[0];
  const type = (VOICE_TYPES.find(([re]) => re.test(s)) || [])[1] || "";
  const mat = (VOICE_MATERIALS.find(([re]) => re.test(s)) || [])[1] || "";
  const temp = /временн/.test(s);
  if (temp && (!type || type === "Коронка")) return "Временная коронка";
  if (!type && !mat) return "";
  if (!type || type === "Коронка") return mat ? `Коронка ${mat}` : "Коронка";
  return [type, temp ? "временный" : "", mat].filter(Boolean).join(" ");
}

function voiceUnits(s) {
  const m = /\s(\d{1,2})\s+(?:шт|штук[а-я]*|единиц[а-я]*|ед\.?|зуб[а-я]*|коронк[а-я]*|винир[а-я]*|вкладк[а-я]*|капп[а-я]*)/.exec(s)
    || /мост[а-я]*\s+на\s+(\d{1,2})/.exec(s) || /\s[x×х]\s?(\d{1,2})\s/.exec(s);
  return m ? Math.min(32, Math.max(1, +m[1])) : 1;
}

// Имя после ключевого слова: 1–2 слова, пока не встретится служебное
function voiceNameAfter(raw, re) {
  const m = re.exec(raw);
  if (!m) return "";
  const words = raw.slice(m.index + m[0].length).replace(/[,.;]/g, " , ").split(/\s+/).filter(Boolean);
  const out = [];
  for (const w of words) {
    if (w === "," || VOICE_STOP.test(w.toLowerCase()) || /\d/.test(w) || out.length === 2) break;
    out.push(w[0].toUpperCase() + w.slice(1));
  }
  return out.join(" ");
}

// Фамилия без ключевого слова: с заглавной буквы или с типичным окончанием, и не из рабочего словаря
const VOICE_VOCAB = /^(коронк|мост|винир|вкладк|культев|бюгел|съемн|капп|ремонт|почин|циркон|диоксид|[еэи]-?макс|e\.?-?max|металл|мк$|времен|пластмасс|штук|шт$|единиц|ед$|зуб|цвет|этап|заказ|нов|к$|на$|в$|во$|до$|через|сдать|сдач|сдан|готов|завтра|послезавтра|сегодня|понедельник|вторник|сред|четверг|пятниц|суббот|воскресень|январ|феврал|март|апрел|ма[йя]$|июн|июл|август|сентябр|октябр|ноябр|декабр|числ|недел|дн[яей]|день|скан|отлив|отлит|модел|фрез|обработ|сыр|запек|запеч|спек|синтер|печ|глазур|покрас|окрас|вклеи|вклей|склеи|клеи|переве|пациент|врач|доктор|клиник|стоматолог|систем|делает|сделает|исполнител|мастер|техник|отда|от$|для$|и$|а$|из$|с$|по$|одн|один|два|две|три|четыр|пять|шест|сем|восем|девят|десят|двадцат|тридцат|перв|втор|трет|следующ|эт[аоу]|тот|та$|ту$)/;
const VOICE_SURNAME = /(ов|ова|ев|ева|ин|ина|ын|ына|ский|ская|цкий|цкая|ук|юк|енко|ян|дзе|швили|их|ых)$/;
function voiceGuessName(raw, exclude) {
  const words = raw.replace(/[,.;!?«»"]/g, " , ").split(/\s+/).filter(Boolean);
  const out = [];
  for (const w of words) {
    const lw = w.toLowerCase().replace(/ё/g, "е");
    const ok = w !== "," && !/\d/.test(w) && lw.length >= 3 && !VOICE_VOCAB.test(lw) && !exclude.includes(lw)
      && (/^[А-ЯЁ]/.test(w) || VOICE_SURNAME.test(lw));
    if (ok) { out.push(w[0].toUpperCase() + w.slice(1)); if (out.length === 2) break; }
    else if (out.length) break;
  }
  return out.join(" ");
}

const lowWords = t => t.toLowerCase().replace(/ё/g, "е").split(/\s+/).filter(Boolean);
const stemIn = (s, w) => new RegExp(`\\s${w.slice(0, Math.max(4, w.length - 2))}`).test(s);

// Врач/клиника: 1) по словам «врач», «доктор», «от», «клиника»; 2) уже встречавшиеся в заказах (без слов пациента)
function voiceDoctor(raw, s, knownDoctors, patientWords) {
  const doc = voiceNameAfter(raw, /(?:^|\s)(?:врач[а-я]*|доктор[а-я]*|от)\s+/i);
  const clinic = voiceNameAfter(raw, /(?:^|\s)(?:клиник[а-я]*|стоматологи[а-я]*)\s+/i);
  const said = [doc, clinic].filter(Boolean).join(" ");
  let best = "", score = 0, pos = Infinity;
  for (const d of knownDoctors) {
    const parts = lowWords(d.replace(/[^а-яёa-z\s]/gi, " ")).filter(w => w.length >= 4 && !patientWords.some(p => p.slice(0, 4) === w.slice(0, 4)));
    const idx = parts.map(p => s.search(new RegExp(`\\s${p.slice(0, Math.max(4, p.length - 2))}`))).filter(i => i >= 0);
    if (idx.length > score || (idx.length && idx.length === score && Math.min(...idx) < pos)) { best = d; score = idx.length; pos = Math.min(...idx); }
  }
  if (said) return doc && clinic ? `${doc} (${clinic})` : doc || clinic;
  return best;   // клиника названа без слова «клиника», но уже встречалась в заказах
}

function voiceSystem(raw, s) {
  const named = voiceNameAfter(raw, /(?:^|\s)систем[а-я]*\s+/i);
  if (named) { const known = VOICE_SYSTEMS.find(([re]) => re.test(" " + named.toLowerCase() + " ")); return known ? known[1] : named; }
  return (VOICE_SYSTEMS.find(([re]) => re.test(s)) || [])[1] || "";
}

function parseOrderSpeech(raw, todayIso, knownDoctors = [], knownWorks = []) {
  const s = voiceNormalize(raw);
  const date = voiceDate(s, todayIso);
  const rest = date.hit ? s.replace(date.hit, " ") : s;   // число из даты не должно стать количеством
  const shade = voiceShade(rest);
  const rest2 = shade.hit ? rest.replace(shade.hit, " ") : rest;
  // Сначала всё, что помечено словами (врач, клиника, система, исполнитель), — потом фамилия пациента из остатка
  const doc = voiceNameAfter(raw, /(?:^|\s)(?:врач[а-я]*|доктор[а-я]*|от)\s+/i);
  const clinic = voiceNameAfter(raw, /(?:^|\s)(?:клиник[а-я]*|стоматологи[а-я]*)\s+/i);
  const executor = voiceNameAfter(raw, /(?:^|\s)(?:делает|сделает|делать\s+будет|исполнител[а-я]*|мастер|техник|отда[а-я]*)\s+/i);
  const system = voiceSystem(raw, rest2);
  const systemWords = system ? lowWords(voiceNameAfter(raw, /(?:^|\s)систем[а-я]*\s+/i) || "") : [];
  const brandWords = lowWords(raw).filter(w => VOICE_SYSTEMS.some(([re]) => re.test(" " + w + " ")));
  const exclude = [...lowWords(doc), ...lowWords(clinic), ...lowWords(executor), ...systemWords, ...brandWords];
  const patient = voiceNameAfter(raw, /(?:^|\s)пациент[а-я]*\s+/i) || voiceGuessName(raw, exclude);
  return {
    work: voiceWork(rest2, knownWorks),
    units: voiceUnits(rest2),
    due: date.due,
    doctor: voiceDoctor(raw, rest2, knownDoctors, lowWords(patient)),
    patient,
    note: [shade.shade && `цвет ${shade.shade}`, system && `система ${system}`, executor && `делает ${executor}`].filter(Boolean).join(", "),
  };
}

/* ---------- этапы работы ---------- */
const STAGES = [
  ["scan", "Сканирование модели"], ["cast", "Отливка модели"], ["model", "Моделировка"], ["mill", "Фрезеровка"],
  ["green", "Обработка сырого циркония"], ["sinter", "Запекание"], ["post", "Обработка после запекания"],
  ["glaze", "Глазурь и покраска"], ["bond", "Вклеивание"], ["handoff", "Сдача"],
];
const stageName = id => (STAGES.find(st => st[0] === id) || [])[1] || "";

// Этап из фразы. «Сдать к пятнице» — это срок, а не этап, поэтому «сдача» только явно: «этап сдача», «сдали», «готова».
function voiceStage(s) {
  if (/обработ/.test(s)) {
    if (/сыр/.test(s)) return "green";
    if (/запеч|запек|спеч|спек|синтер|после/.test(s)) return "post";
  }
  if (/скан/.test(s)) return "scan";
  if (/отлив|отлит/.test(s)) return "cast";
  if (/моделир|моделиров/.test(s)) return "model";
  if (/фрез/.test(s)) return "mill";
  if (/запек|запеч|синтер|спек|\sпечь|\sпечк/.test(s)) return "sinter";
  if (/глазур|покрас|окрас/.test(s)) return "glaze";
  if (/вклеи|вклей|склеи|приклеи|клеим/.test(s)) return "bond";
  if (/этап\s+сдач|\sсдан[аоы]?\s|\sсдали\s|\sотдали\s|\sготов[аоы]?\s/.test(s)) return "handoff";
  return "";
}

// Какие несданные заказы похожи на фразу: пациент весит больше врача, вид работы — меньше всего
function voiceMatchOrders(raw, orders) {
  const s = voiceNormalize(raw);
  const stemHit = text => (text || "").toLowerCase().replace(/ё/g, "е").split(/[^а-яa-z]+/).filter(w => w.length >= 4)
    .filter(p => new RegExp(`\\s${p.slice(0, Math.max(4, p.length - 2))}`).test(s)).length;
  const typeOf = w => (VOICE_TYPES.find(([re]) => re.test(" " + w.toLowerCase() + " ")) || [])[1];
  const matOf = w => (VOICE_MATERIALS.find(([re]) => re.test(" " + w.toLowerCase().replace(/ё/g, "е") + " ")) || [])[1];
  // «обработка сырого циркония» — название этапа, а не материал заказа
  const sw = s.replace(/(обработ[а-я]*\s+)?(сыр|запеч|запек|спеч|спек)[а-я]*\s+циркон[а-я]*/g, " ");
  const sType = (VOICE_TYPES.find(([re]) => re.test(sw)) || [])[1], sMat = (VOICE_MATERIALS.find(([re]) => re.test(sw)) || [])[1];
  const scored = orders.filter(o => !o.done).map(o => {
    const who = stemHit(o.patient) * 3 + stemHit(o.doctor) * 2;
    const what = (sType && typeOf(o.work || "") === sType ? 1 : 0) + (sMat && matOf(o.work || "") === sMat ? 1 : 0);
    return { o, score: who + what, who };
  }).filter(x => x.who > 0 || x.score >= 2).sort((a, b) => b.score - a.score || a.o.due.localeCompare(b.o.due));
  if (!scored.length) return [];
  const top = scored[0].score;
  return scored.filter(x => x.score === top).slice(0, 5).map(x => x.o);
}

// Что хотят: перевести этап существующего заказа или завести новый
function voiceIntent(raw, todayIso, orders, knownDoctors, knownWorks) {
  const s = voiceNormalize(raw);
  const stage = voiceStage(s);
  const order = parseOrderSpeech(raw, todayIso, knownDoctors, knownWorks);
  order.stage = stage;
  const explicit = /\sэтап|перевед|переведи|перевести|передвин|\sна\s+(скан|отлив|моделир|фрез|обработ|запек|спек|синтер|печь|глазур|покрас|вклей|вклеи|сдач)/.test(s);
  const matches = stage && (explicit || !order.due) ? voiceMatchOrders(raw, orders) : [];
  return { stage, order, matches };
}

/* ---------- экраны ---------- */
function orderCard(o, showDate) {
  const who = [o.patient && `пациент ${esc(o.patient)}`, o.doctor && esc(o.doctor)].filter(Boolean).join(" · ");
  return `<div class="order${o.done ? " done" : ""}">
    <input type="checkbox" class="check" data-done="${esc(o.id)}" ${o.done ? "checked" : ""} aria-label="Готово">
    <div class="body">
      <div class="work">${esc(o.work || "Работа")}${o.units > 1 ? ` × ${o.units}` : ""}</div>
      ${o.stage ? `<button class="stagepill" data-stage="${esc(o.id)}">${esc(stageName(o.stage))} · ${STAGES.findIndex(st => st[0] === o.stage) + 1}/${STAGES.length}</button>`
        : o.done ? "" : `<button class="stagepill empty" data-stage="${esc(o.id)}">+ этап</button>`}
      ${who ? `<div class="meta">${who}</div>` : ""}
      ${showDate ? `<div class="meta">сдать ${human(o.due)}</div>` : ""}
      ${o.note ? `<div class="note">${esc(o.note)}</div>` : ""}
    </div>
    <button class="edit" data-edit="${esc(o.id)}">изменить</button>
  </div>`;
}

function renderDay() {
  const t = today(), d = S.sel, list = dueOn(d).sort(byWork), open = openOn(d).length;
  let h = `<section class="dayhead">
    <button class="iconbtn" data-shift="-1" aria-label="Предыдущий день">‹</button>
    <div class="grow"><h1>${rel(d)}, ${human(d)}</h1><div class="sub">${WD[parse(d).getDay()]} · ${chip(open)}</div></div>
    <button class="iconbtn" data-shift="1" aria-label="Следующий день">›</button>
    ${d !== t ? `<button class="linkbtn" data-goto="${t}">К сегодня</button>` : ""}
  </section>`;

  if (d === t) {
    const overdue = live().filter(o => !o.done && o.due < t).sort((a, b) => a.due.localeCompare(b.due));
    if (overdue.length) h += `<div class="notice overdue"><b>Просрочено: ${works(overdue.length)}</b><div class="list">${overdue.map(o => orderCard(o, true)).join("")}</div></div>`;
    const r = [1, 2].map(k => [addDays(t, k), openOn(addDays(t, k)).length]).filter(([, n]) => n);
    if (r.length) h += `<div class="notice remind"><b>Напоминание</b>${r.map(([dd, n]) => `<span>${rel(dd)} (${human(dd)}) сдать ${worksAcc(n)}</span>`).join("")}</div>`;
  }

  h += `<section><h2>На сдачу</h2><div class="list">${list.length ? list.map(o => orderCard(o)).join("") : `<div class="empty">На этот день заказов нет. Нажмите «+ Заказ», чтобы добавить.</div>`}</div></section>`;

  const next = [1, 2, 3].map(k => addDays(d, k));
  h += `<section><h2>Ближайшие дни</h2><div class="upcoming">${next.map(dd => {
    const os = openOn(dd);
    return `<button class="uday" data-goto="${dd}"><span class="row"><b>${rel(dd)}, ${human(dd)}</b>${chip(os.length)}</span>${os.length ? `<ul>${os.slice(0, 4).map(o => `<li>${esc(o.work)}${o.doctor ? ` — ${esc(o.doctor)}` : ""}</li>`).join("")}${os.length > 4 ? `<li>и ещё ${os.length - 4}</li>` : ""}</ul>` : ""}</button>`;
  }).join("")}</div></section>`;
  return h;
}

function renderCal() {
  const y = S.calY, m = S.calM, t = today();
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<div class="cell out"></div>`;
  for (let dn = 1; dn <= days; dn++) {
    const d = iso(new Date(y, m, dn)), n = openOn(d).length, all = dueOn(d).length;
    const lv = d < t ? 0 : level(n);
    cells += `<button class="cell l${lv}${d === t ? " today" : ""}${d < t ? " past" : ""}" data-goto="${d}" aria-label="${human(d)}: ${works(n)}">
      <span class="n">${dn}</span><span class="c">${n || (all ? "✓" : "")}</span></button>`;
  }
  return `<section class="calhead">
      <button class="iconbtn" data-month="-1" aria-label="Предыдущий месяц">‹</button>
      <h1>${cap(MONTHS[m])} ${y}</h1>
      <button class="iconbtn" data-month="1" aria-label="Следующий месяц">›</button>
    </section>
    <section class="grid">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(w => `<div class="wd">${w}</div>`).join("")}${cells}</section>
    <section class="legend"><span class="chip l1">1 работа</span><span class="chip l2">2–4 работы</span><span class="chip l3">5 и больше</span><span class="chip l0">✓ всё сдано</span></section>
    <div class="sub">Число в клетке — сколько работ ещё не сдано. Нажмите на день, чтобы открыть его.</div>`;
}

// Открыто любое окно или меню — тогда не перерисовываем и не перезагружаем страницу под ним
const modalOpen = () => !!document.getElementById("modal").firstElementChild;
// Каждое окно начинает с чистого листа: обработчики меню не должны пережить его закрытие
function resetModal(m) {
  m.onclick = m.onpointerdown = m.onpointermove = m.onpointerup = m.onpointercancel = null;
  menuPage = null; lpFired = false; editingWish = null;
}
function render() {

}

function go(d) { S.sel = d; S.view = "day"; const p = parse(d); S.calY = p.getFullYear(); S.calM = p.getMonth(); render(); window.scrollTo(0, 0); }

document.addEventListener("click", e => {

  else if (b.dataset.month) { const d = new Date(S.calY, S.calM + +b.dataset.month, 1); S.calY = d.getFullYear(); S.calM = d.getMonth(); render(); }

/* ---------- изменения ---------- */
// Этап «Сдача» и галочка «сдано» — одно и то же: держим их согласованными
function normStage(next, prev) {
  if (next.deleted) return next;
  if (next.stage !== prev.stage && next.stage) next.done = next.stage === "handoff";
  else if (!!next.done !== !!prev.done) next.stage = next.done ? "handoff" : next.stage === "handoff" ? "bond" : next.stage;
  return next;
}
function putOrder(o) {
  store.orders[o.id] = { ...normStage({ ...o }, store.orders[o.id] || {}), updatedAt: Date.now() };
  editSeq++; saveLocal(); lsSet(LS_DIRTY, true); render(); scheduleSync();
}

// Браузерное распознавание речи (Chrome, Safari). Где его нет — поле для диктовки с клавиатуры, разбор тот же.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopRec() { const r = rec; rec = null; try { r && r.abort(); } catch (e) {} }

function openVoice() {
  const m = document.getElementById("modal"); resetModal(m);
  m.innerHTML = `<div class="overlay" id="ov"><div class="sheet">
    <div class="vhead"><h2>Голосовой ввод</h2><button class="infobtn" id="v-info" aria-expanded="false" aria-controls="v-help" aria-label="Как фраза раскладывается по полям" title="Как фраза раскладывается по полям">i</button></div>
    <div class="vhelp" id="v-help" hidden><ul>
      <li><b>Дата:</b> «сегодня», «завтра», «в пятницу», «через неделю», «к 30 числу». «25 октября» — этот год, «25 октября 2027» — названный.</li>
      <li><b>Работа:</b> коронка, мост, винир, вкладка, бюгельный, съёмный, каппа, ремонт + материал: цирконий, E.max, металлокерамика, временная.</li>
      <li><b>Количество:</b> «две коронки», «мост на 3 единицы», «2 штуки».</li>
      <li><b>Пациент:</b> фамилия без пояснения («…Смирнова…») или «пациент Смирнова».</li>
      <li><b>Клиника и врач:</b> только со словом: «клиника Улыбка», «врач Петров».</li>
      <li><b>В комментарий:</b> «цвет А2», «система Осстем» или просто название системы (Straumann, Nobel, Osstem, MIS…), «делает Саша» (или «исполнитель», «мастер»).</li>
      <li><b>Этап:</b> «Смирнова коронка, этап фрезер» — предложит перевести уже существующий заказ.</li>
      <li>Перед сохранением всегда открывается форма — там можно поправить любое поле.</li>
    </ul></div>
    <div class="sub" id="v-status">${SpeechRec ? "Слушаю…" : "Нажмите микрофон на клавиатуре и продиктуйте — или напишите."}</div>
    <div class="field"><label for="v-text">Фраза</label><textarea id="v-text" rows="3" placeholder="коронка цирконий 2 штуки, Петров, к пятнице, цвет А2"></textarea></div>
    <div class="sub">Новый заказ: «коронка цирконий, Смирнова, клиника Улыбка, 25 октября, цвет А2, система Осстем, делает Саша». Перевести этап: «Смирнова коронка, этап фрезер».</div>
    <div class="actions"><button class="primary" id="v-go">Разобрать</button>${SpeechRec ? `<button class="ghost" id="v-again">Слушать ещё раз</button>` : ""}<button class="ghost" id="v-cancel">Отмена</button></div>
  </div></div>`;
  const ta = document.getElementById("v-text");
  const status = t => { const el = document.getElementById("v-status"); if (el) el.textContent = t; };
  const close = () => { stopRec(); m.innerHTML = ""; render(); };
  document.getElementById("ov").addEventListener("click", e => {
    if (e.target.id === "ov" || e.target.id === "v-cancel") return close();
    if (e.target.id === "v-again") return listen();
    if (e.target.id === "v-info") { const h = document.getElementById("v-help"); h.hidden = !h.hidden; e.target.setAttribute("aria-expanded", !h.hidden); return; }
    if (e.target.id === "v-go") { const text = ta.value.trim(); if (!text) return status("Скажите или напишите фразу."); stopRec(); handleVoice(text); }
  });
  function listen() {
    stopRec();
    const r = new SpeechRec(); rec = r;
    r.lang = "ru-RU"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    let finalText = "";
    status("Слушаю…");
    r.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += t; else interim += t; }
      if (ta.isConnected) ta.value = (finalText + interim).trim();
    };
    r.onerror = e => {
      if (rec !== r || !ta.isConnected) return;
      status(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Нет доступа к микрофону. Разрешите его в настройках или продиктуйте с клавиатуры."
        : e.error === "no-speech" ? "Ничего не услышал. Нажмите «Слушать ещё раз»." : "Не получилось распознать. Можно продиктовать с клавиатуры.");
    };
    r.onend = () => {
      if (rec !== r) return;          // остановили сами или запустили заново
      rec = null;
      if (!ta.isConnected) return;    // окно уже закрыто
      if (finalText.trim()) handleVoice(ta.value.trim()); else if (/Слушаю/.test(document.getElementById("v-status")?.textContent || "")) status("Ничего не услышал. Нажмите «Слушать ещё раз».");
    };
    try { r.start(); } catch (e) { rec = null; status("Не получилось включить микрофон. Продиктуйте с клавиатуры."); }
  }
  if (SpeechRec) listen(); else setTimeout(() => ta.focus(), 30);
}

function handleVoice(text) {
  const doctors = [...new Set(live().map(x => x.doctor).filter(Boolean))];
  const known = [...new Set(live().map(x => x.work).filter(Boolean))];
  const r = voiceIntent(text, today(), live(), doctors, known);
  if (!(r.stage && r.matches.length)) return openForm(null, { prefill: r.order, heard: text });
  // Похоже на перевод этапа существующего заказа — спрашиваем, какого
  const m = document.getElementById("modal"); resetModal(m);
  m.innerHTML = `<div class="overlay" id="ov"><div class="sheet">
    <h2>Перевести на «${esc(stageName(r.stage))}»?</h2>
    <div class="heard">Распознано: <b>«${esc(text)}»</b></div>
    <div class="stagelist">${r.matches.map(o => `<button class="stageopt" data-move="${esc(o.id)}"><span><b>${esc(o.work || "Работа")}${o.units > 1 ? ` × ${o.units}` : ""}</b>
      <span class="meta">${[o.patient && "пациент " + esc(o.patient), o.doctor && esc(o.doctor), "сдать " + human(o.due), o.stage && "сейчас: " + esc(stageName(o.stage))].filter(Boolean).join(" · ")}</span></span></button>`).join("")}</div>
    <div class="actions"><button class="ghost" id="vm-new">Нет, это новый заказ</button><button class="ghost" id="vm-cancel">Отмена</button></div>
  </div></div>`;
  document.getElementById("ov").addEventListener("click", e => {
    if (e.target.id === "ov" || e.target.id === "vm-cancel") { m.innerHTML = ""; return render(); }
    if (e.target.id === "vm-new") return openForm(null, { prefill: r.order, heard: text });
    const b = e.target.closest("[data-move]");
    if (b) { m.innerHTML = ""; putOrder({ ...store.orders[b.dataset.move], stage: r.stage }); }
  });
}

/* ---------- синхронизация через секретный GitHub Gist ---------- */
const GIST_FILE = "dental-lab-orders.json";
const GIST_DESC = "Данные приложения «Журнал зуботехнической лаборатории»";
const TOMBSTONE_TTL = 365 * 24 * 3600 * 1000;   // год: устройство, не выходившее в сеть дольше, может вернуть удалённое
let sync = lsGet(LS_SYNC, { token: "", gistId: "" });
let syncBusy = false, syncAgain = false, syncTimer = null;
const cloudConnected = () => !!(sync.token && sync.gistId);

async function gh(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, { ...opts, cache: "no-store", headers: {
    Authorization: "Bearer " + sync.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" } });
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  return r.json();
}

async function findOrCreateGist() {
  // Листаем все гисты: нужный может быть не на первой странице
  for (let page = 1; page <= 20; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const found = list.find(g => g.files && g.files[GIST_FILE]);
    if (found) return found.id;
    if (list.length < 100) break;
  }
  const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: GIST_DESC, public: false, files: { [GIST_FILE]: { content: JSON.stringify(store) } } }) });
  return g.id;
}

async function fetchRemote() {
  const g = await gh("/gists/" + sync.gistId);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return { orders: {}, wishes: {} };
  let text = f.content;
  if (f.truncated) {
    const r = await fetch(f.raw_url, { cache: "no-store" });
    if (!r.ok) { const e = new Error("raw " + r.status); e.status = r.status; throw e; }
    text = await r.text();
  }
  if (!text || !text.trim()) return { orders: {}, wishes: {} };
  // Битый ответ — ошибка, а не «пустое облако»: иначе следующий PATCH затёр бы данные в Gist
  const d = JSON.parse(text);
  if (!d || typeof d !== "object") throw new Error("bad gist data");
  return { orders: d.orders || {}, wishes: d.wishes || {} };
}

// По каждой записи побеждает более поздняя правка; старые надгробия выбрасываем
function mergeMap(x = {}, y = {}) {
  const out = {}, cutoff = Date.now() - TOMBSTONE_TTL;
  for (const src of [x, y]) for (const [id, o] of Object.entries(src)) {
    const cur = out[id];
    if (!cur || (o.updatedAt || 0) > (cur.updatedAt || 0)) out[id] = o;
  }
  for (const [id, o] of Object.entries(out)) if (o.deleted && (o.updatedAt || 0) < cutoff) delete out[id];
  return out;
}
const merge = (a, b) => ({ orders: mergeMap(a.orders, b.orders), wishes: mergeMap(a.wishes, b.wishes) });
const sigMap = (m = {}) => Object.keys(m).sort().map(id => id + ":" + (m[id].updatedAt || 0)).join("|");
const sig = s => sigMap(s.orders) + "#" + sigMap(s.wishes);

function setSyncStatus(text, cls) {
  const b = document.getElementById("syncbtn");
  b.textContent = text; b.className = "syncbtn" + (cls ? " " + cls : "");
}
const hhmm = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

function scheduleSync(delay = 1500) {
  if (!cloudConnected()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, delay);
}

async function syncNow() {
  if (!cloudConnected()) { setSyncStatus("☁ не подключено"); return; }
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; syncAgain = false;
  setSyncStatus("☁ синхронизация…");
  try {
    const remote = await fetchRemote();
    if (!cloudConnected()) throw Object.assign(new Error("off"), { off: true });   // отключили, пока ждали ответ
    const merged = merge(store, remote);   // store читаем после await — правки, сделанные во время загрузки, не теряются
    const seq = editSeq;
    if (sig(merged) !== sig(store)) { store = merged; saveLocal(); if (!modalOpen()) render(); }
    if (sig(merged) !== sig(remote)) await gh("/gists/" + sync.gistId, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(merged) } } }) });
    if (editSeq === seq) lsSet(LS_DIRTY, false); else syncAgain = true;   // правки во время отправки — ещё один проход
    setSyncStatus("☁ " + hhmm(), "ok");
  } catch (e) {
    if (e.off) setSyncStatus("☁ не подключено"); else
    setSyncStatus(e.status === 401 ? "☁ токен не подходит" : lsGet(LS_DIRTY, false) ? "☁ нет связи, отправлю позже" : "☁ нет связи", "err");
  }
  syncBusy = false;
  if (syncAgain) syncNow();
}

function openSync() {
  const m = document.getElementById("modal"); resetModal(m);
  const on = cloudConnected();
  m.innerHTML = `<div class="overlay" id="ov"><div class="sheet">
    <h2>Синхронизация</h2>
    ${on ? `<div class="sub">Заказы хранятся в вашем секретном GitHub Gist и обновляются на всех устройствах, где введён токен.</div>
      <div class="actions"><button class="primary" id="s-now">Синхронизировать сейчас</button><button class="ghost" id="s-close">Закрыть</button></div>
      <div class="actions"><button class="danger" id="s-off">Отключить на этом устройстве</button></div>`
    : `<div class="field"><label for="s-token">Токен GitHub (только галочка «gist»)</label><input id="s-token" type="password" placeholder="ghp_…" autocomplete="off"></div>
      <div class="actions"><button class="primary" id="s-connect">Подключить</button><button class="ghost" id="s-close">Закрыть</button></div>
      <ol>
        <li>Откройте <code>github.com/settings/tokens</code> → <b>Generate new token (classic)</b>.</li>
        <li>Срок — <b>No expiration</b>, галочка только <b>gist</b>.</li>
        <li>Скопируйте строку <code>ghp_…</code> и вставьте сюда. На каждом устройстве — тот же токен.</li>
      </ol>`}
    <div class="msg" id="s-msg" role="status"></div>
  </div></div>`;
  // Ответ сети может прийти, когда окно уже закрыто (или открыто другое) — тогда ничего в нём не трогаем
  const sheet = m.firstElementChild;
  const close = () => { if (!sheet.isConnected) return; m.innerHTML = ""; render(); };
  const msg = (t, c) => { const el = sheet.querySelector("#s-msg"); if (!sheet.isConnected || !el) return; el.textContent = t; el.className = "msg " + (c || ""); };
  document.getElementById("ov").addEventListener("click", e => { if (e.target.id === "ov") close(); });
  document.getElementById("s-close").onclick = close;
  if (on) {
    document.getElementById("s-now").onclick = async () => {
      msg("Синхронизирую…");
      await syncNow();
      while (syncBusy) await new Promise(r => setTimeout(r, 200));   // если уже шла синхронизация — дождаться её конца
      const sb = document.getElementById("syncbtn");
      msg(sb.textContent, sb.classList.contains("err") ? "err" : "ok");
    };
    const off = document.getElementById("s-off");
    off.onclick = () => {
      if (!off.classList.contains("armed")) { off.classList.add("armed"); off.textContent = "Точно отключить? Заказы на устройстве останутся"; return; }
      sync = { token: "", gistId: "" }; lsSet(LS_SYNC, sync); setSyncStatus("☁ не подключено"); close();
    };
  } else {
    document.getElementById("s-connect").onclick = async e => {
      const token = document.getElementById("s-token").value.trim();
      if (!token) { msg("Вставьте токен в поле выше.", "err"); return; }
      e.target.disabled = true; msg("Подключаю…");
      sync = { token, gistId: "" };
      try {
        sync.gistId = await findOrCreateGist();
        lsSet(LS_SYNC, sync);
        await syncNow();
        close();
      } catch (err) {
        sync = { token: "", gistId: "" }; e.target.disabled = false;
        msg(err.status === 401 ? "GitHub не принял токен. Проверьте, что скопировали его целиком и отметили галочку «gist»."
          : err.status === 403 || err.status === 404 ? "У токена нет доступа к Gist. Создайте новый с галочкой «gist»."
          : "Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.", "err");
      }
    };
  }
}

// Масштаб всего интерфейса (CSS zoom): текст, кнопки и календарь растут вместе
const SCALES = [[0.8, "Совсем мелко"], [0.9, "Мельче"], [1, "Обычный"], [1.1, "Крупнее"]];
let prefs = { theme: "system", accent: "teal", scale: 1, ...lsGet(LS_PREFS, {}) };
if (!SCALES.some(([k]) => k === prefs.scale)) prefs.scale = SCALES.reduce((best, [k]) => Math.abs(k - prefs.scale) < Math.abs(best - prefs.scale) ? k : best, 1);
const darkMq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => prefs.theme === "dark" || (prefs.theme === "system" && darkMq.matches);

function applyPrefs() {
  const r = document.documentElement;
  if (prefs.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", prefs.theme);
  const a = ACCENTS[prefs.accent] || ACCENTS.teal;
  r.style.setProperty("--accent", isDark() ? a.dark : a.light);
  r.style.setProperty("--accent-ink", a.ink ? (isDark() ? a.ink.dark : a.ink.light) : "");
  r.style.setProperty("--on-accent", a.on || "");
  r.style.setProperty("--accent-soft", a.on ? "color-mix(in srgb, var(--accent) 35%, var(--surface))" : "");
  r.style.zoom = prefs.scale === 1 ? "" : prefs.scale;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(r).getPropertyValue("--bg").trim();
}
darkMq.addEventListener("change", applyPrefs);

];
const customWishes = () => Object.entries(store.wishes).filter(([, w]) => w.custom && !w.deleted).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0));
const wishesChecked = () => Object.values(store.wishes).filter(w => w.checked && !w.deleted && !w.hidden).length;
const hiddenWishes = () => Object.entries(store.wishes).filter(([, w]) => w.hidden && !w.custom);
function putWish(id, patch) {
  store.wishes[id] = { ...store.wishes[id], ...patch, updatedAt: Date.now() };
  editSeq++; saveLocal(); lsSet(LS_DIRTY, true); scheduleSync();
}
let editingWish = null;
const wishRow = (id, title, desc, w = store.wishes[id] || {}) => editingWish === id
  ? `<div class="wish editing" data-row="${esc(id)}"><div class="wedit">
      ${w.custom ? `<textarea id="we-title" rows="2">${esc(title)}</textarea>`
        : `<input id="we-title" value="${esc(title)}"><textarea id="we-desc" rows="2">${esc(desc)}</textarea>`}
      <div class="wconfirm"><button class="wedit-btn" data-wish-save="${esc(id)}">Сохранить</button><button class="wcancel" data-wish-edit-cancel="1">Отмена</button></div></div></div>`
  : `<div class="wish" data-row="${esc(id)}">
  <input type="checkbox" class="check" id="w-${esc(id)}" data-wish="${esc(id)}" ${w.checked ? "checked" : ""}>
  <label for="w-${esc(id)}"><b>${esc(title)}</b>${desc ? `<span>${esc(desc)}</span>` : ""}</label>
  <div class="wconfirm"><button class="wedit-btn" data-wish-edit="${esc(id)}">Изменить</button><button class="wremove" data-wish-remove="${esc(id)}">Удалить</button><button class="wcancel" data-wish-cancel="1">Отмена</button></div></div>`;
function renderWishes() {
  const own = customWishes();
  const hidden = hiddenWishes().length;
  return `<div class="sub">Отметь, что нужно сделать. Своё можно дописать в самом низу. Долгое нажатие на пункт — изменить или удалить.</div>
    ${WISHES.map(([group, items]) => {
      const shown = items.filter(([id]) => !(store.wishes[id] || {}).hidden);
      return shown.length ? `<div class="dsec"><h2>${group}</h2>${shown.map(([id, t, d]) => { const w = store.wishes[id] || {}; return wishRow(id, w.title || t, w.desc ?? d); }).join("")}</div>` : "";
    }).join("")}
    <div class="dsec"><h2>Свои просьбы</h2>${own.map(([id, w]) => wishRow(id, w.text, "")).join("")}

let lpFired = false, menuPage = null;   // открытая страница меню — в переменной, не в атрибуте: иначе [data-page] ловит сам контейнер
function openMenu(page) {
  const m = document.getElementById("modal");
  const first = !m.querySelector(".drawer");
  const same = !first && menuPage === page;
  const keepScroll = same ? m.querySelector(".drawer").scrollTop : 0;
  const draft = same ? m.querySelector("#w-new")?.value || "" : "";   // недописанная просьба переживает перерисовку
  if (first) resetModal(m);
  menuPage = page;
  const title = page === "main" ? "Меню" : MENU.find(x => x[0] === page)[1];
  const body = page === "main"
    ? `<div class="mitems">${MENU.map(([k, n, hint]) => `<button class="mitem" data-page="${k}"><span>${n}</span><span class="hint">${hint()} ›</span></button>`).join("")}</div>`
    : MENU_PAGES[page]();
  m.innerHTML = `<div class="drawer-ov" data-close="1"></div><nav class="drawer${first ? " enter" : ""}" aria-label="Меню">
    ${page === "main" ? "" : `<button class="dback" data-page="main">‹ Меню</button>`}
    <div class="dhead"><h2 class="dtitle">${title}</h2><button class="dclose" data-close="1" aria-label="Закрыть">×</button></div>
    ${body}</nav>`;
  m.querySelector(".drawer").scrollTop = keepScroll;
  if (draft && m.querySelector("#w-new")) m.querySelector("#w-new").value = draft;
  if (editingWish) setTimeout(() => m.querySelector("#we-title")?.focus(), 30);
  let lpTimer = null, x0 = 0, y0 = 0;
  m.onpointerdown = e => {
    lpFired = false;   // любое новое касание сбрасывает флаг, иначе он съел бы следующий тап
    const row = e.target.closest(".wish[data-row]");
    if (!row || row.classList.contains("editing") || e.target.closest(".wconfirm, input, textarea")) return;
    x0 = e.clientX; y0 = e.clientY;
    lpTimer = setTimeout(() => {
      lpFired = true;
      m.querySelectorAll(".wish.confirm").forEach(r => r.classList.remove("confirm"));
      row.classList.add("confirm");
      navigator.vibrate?.(30);
    }, 550);
  };
  m.onpointermove = e => { if (lpTimer && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) { clearTimeout(lpTimer); lpTimer = null; } };
  m.onpointerup = () => { clearTimeout(lpTimer); lpTimer = null; if (lpFired) setTimeout(() => { lpFired = false; }, 400); };
  m.onpointercancel = () => { clearTimeout(lpTimer); lpTimer = null; lpFired = false; };   // палец ушёл в прокрутку — клика не будет
  m.onclick = e => {
    // Отпускание после долгого нажатия не должно переключать галочку
    if (lpFired) { lpFired = false; e.preventDefault(); return; }
    const b = e.target.closest("[data-close], [data-page], [data-set-theme], [data-set-accent], [data-set-scale], [data-wish], [data-wish-add], [data-wish-remove], [data-wish-cancel], [data-wish-restore], [data-wish-edit], [data-wish-save], [data-wish-edit-cancel]");
    if (!b) return;
    if (b.dataset.wishEdit) { editingWish = b.dataset.wishEdit; openMenu(page); return; }
    if (b.dataset.wishEditCancel) { editingWish = null; openMenu(page); return; }
    if (b.dataset.wishSave) {
      const id = b.dataset.wishSave, title = m.querySelector("#we-title").value.trim(), desc = m.querySelector("#we-desc")?.value.trim();
      if (title) putWish(id, (store.wishes[id] || {}).custom ? { text: title } : { title, desc });
      editingWish = null; openMenu(page); return;
    }
    if (b.dataset.wish) { putWish(b.dataset.wish, { checked: b.checked }); return; }
    if (b.dataset.wishCancel) { b.closest(".wish").classList.remove("confirm"); return; }
    if (b.dataset.wishRemove) {
      const id = b.dataset.wishRemove;
      putWish(id, (store.wishes[id] || {}).custom ? { deleted: true } : { hidden: true });
      openMenu(page); return;
    }
    if (b.dataset.wishRestore) { hiddenWishes().forEach(([id]) => putWish(id, { hidden: false })); openMenu(page); return; }
    if (b.dataset.wishAdd) {
      const text = document.getElementById("w-new").value.trim();
      if (!text) return;
      putWish("c-" + newId(), { text, custom: true, checked: true, createdAt: Date.now() });
      document.getElementById("w-new").value = "";
      openMenu(page); return;
    }
    if (b.dataset.close) { resetModal(m); m.innerHTML = ""; render(); }
    else if (b.dataset.page === "sync") { m.innerHTML = ""; openSync(); }
    else if (b.dataset.page) openMenu(b.dataset.page);
    else {
      if (b.dataset.setTheme) prefs.theme = b.dataset.setTheme;
      if (b.dataset.setAccent) prefs.accent = b.dataset.setAccent;
      if (b.dataset.setScale) prefs.scale = +b.dataset.setScale;
      lsSet(LS_PREFS, prefs); applyPrefs(); openMenu(page);
    }
  };
}

// Сравниваем ETag страницы на GitHub Pages: изменился — значит, выложена новая версия, перезагружаемся
let pageTag = null;
async function currentTag() {
  try { const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" }); return r.ok ? (r.headers.get("etag") || r.headers.get("last-modified")) : null; }
  catch (e) { return null; }
}
async function checkAppUpdate() {
  const t = await currentTag();
  if (!t) return;
  if (!pageTag) { pageTag = t; return; }
  if (t !== pageTag && !modalOpen()) location.reload();
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

// Наступила полночь — «сегодня» сдвигается (и если приложение лежит открытым, и после сворачивания)
function checkDayChange() { if (today() !== lastDay) { if (S.sel === lastDay) S.sel = today(); lastDay = today(); if (!modalOpen()) render(); } }
document.addEventListener("visibilitychange", () => {

  if (document.hidden) { if (lsGet(LS_DIRTY, false)) { clearTimeout(syncTimer); syncNow(); } return; }
  checkDayChange(); syncNow(); checkAppUpdate();
});
setInterval(() => { if (!document.hidden) { checkDayChange(); syncNow(); checkAppUpdate(); } }, 30000);
// Правки из другой вкладки этого же браузера
window.addEventListener("storage", e => {
  if (e.key !== LS_DATA || !e.newValue) return;
  try { const other = JSON.parse(e.newValue); store = merge(store, { orders: other.orders || {}, wishes: other.wishes || {} }); if (!modalOpen()) render(); } catch (err) {}
});
// Появился интернет — сразу отправляем накопленное и забираем чужое
window.addEventListener("online", () => syncNow());
</script>
</body>
